[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tide-scribe-rebus-generator"
version = "0.2.0"
description = "Algorithmic on-the-fly Rebus puzzle generation engine and CLI with phonetic, spatial, and semantic decomposition"
readme = "README.md"
authors = [{ name = "George Armah" }]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []

[project.scripts]
tide-rebus = "rebus.cli:main"
